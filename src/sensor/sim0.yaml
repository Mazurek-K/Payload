# ============================================================
# 1. Running mode
# ============================================================
exposure:
  pipeline_seed: 42

  readout:
    times: [10., 20., 30., 40., 50., 60.]
    non_destructive: true


# ============================================================
# 2. Detector
# ============================================================
cmos_detector:
  geometry:
    row: 128
    col: 128
    total_thickness: 40.0
    pixel_vert_size: 30.0
    pixel_horz_size: 30.0

  environment:
    temperature: 60.0

  characteristics:
    quantum_efficiency: 0.7

    charge_to_volt:
      value: 3.0e-6

    pre_amplification: 1.0
    adc_bit_resolution: 16
    adc_voltage_range: [0.0, 10.0]
    full_well_capacity: 100000


# ============================================================
# 3. Pipeline
# ============================================================
pipeline:

  # Photon collection
  photon_collection:
    - name: shot_noise
      func: sensor.models.photon_collection.shot_noise
      enabled: true

  # Photon -> electrons
  charge_generation:
    - name: photoelectrons
      func: sensor.models.charge_generation.simple_conversion
      enabled: true

    - name: cosmix
      func: sensor.models.charge_generation.cosmix
      enabled: false
      arguments:
        simulation_mode: cosmic_ray
        running_mode: stepsize
        particle_type: proton
        particles_per_second: 100
        initial_energy: random
        progressbar: false

  # Charge -> pixel wells
  charge_collection:
    - name: simple_collection
      func: sensor.models.charge_collection.simple_collection
      enabled: true

    - name: simple_full_well
      func: sensor.models.charge_collection.simple_full_well
      enabled: true

  # Pixel charge -> voltage
  charge_measurement:
    - name: simple_measurement
      func: sensor.models.charge_measurement.simple_measurement
      enabled: true

  # Voltage -> digital image
  readout_electronics:
    - name: simple_amplifier
      func: sensor.models.readout_electronics.simple_amplifier
      enabled: true

    - name: simple_adc
      func: sensor.models.readout_electronics.simple_adc
      enabled: true